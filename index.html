<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoned TRI Brut</title>
    <!-- Aucune origine externe : Space Mono est servie depuis /fonts (SIL OFL 1.1, voir licenses/),
         et le rôle « display » s'appuie sur la grotesque du système. Le @font-face vit dans la
         feuille de l'application, chargée après ce document : les deux graisses employées partout
         sont donc préchargées ici. `crossorigin` est obligatoire même en même origine — une police
         se récupère toujours en mode CORS. -->
    <link rel="preload" href="/fonts/space-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-mono-700.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
